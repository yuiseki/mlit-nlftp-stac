# Static hosting for the generated catalog.
#
# Install to /etc/nginx/sites-available/ and symlink into sites-enabled/, then
# point a Cloudflare Tunnel public hostname at http://localhost:8088.
#
# The port is deliberately not 80: the default server already owns that, and
# this vhost is reached through the tunnel rather than by name on the LAN.

server {
    listen 127.0.0.1:8088;
    server_name _;

    root /srv/mlit-nlftp-stac;
    index catalog.json;

    charset utf-8;
    charset_types application/json application/geo+json text/markdown;

    # A STAC client running on another origin (STAC Browser, a notebook, a
    # viewer) cannot read a single file without these.
    add_header Access-Control-Allow-Origin  "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Range, If-None-Match, If-Modified-Since" always;
    add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges, ETag" always;

    location / {
        if ($request_method = OPTIONS) {
            return 204;
        }
        types {
            application/json      json;
            application/geo+json  geojson;
            text/markdown         md;
        }
        default_type application/json;
        autoindex on;
        autoindex_format html;
        try_files $uri $uri/ =404;
    }

    # The catalog is rebuilt, not edited: a short cache with revalidation keeps
    # a reader from holding a stale collection for a week.
    location ~* \.(json|geojson)$ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
    }

    access_log /var/log/nginx/mlit-nlftp-stac.access.log;
    error_log  /var/log/nginx/mlit-nlftp-stac.error.log;
}
