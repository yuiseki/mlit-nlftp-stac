# stac.yuiseki.net — static STAC catalogs.
#
# One host, one directory per catalog:
#
#   /data/www/html/stac/mlit-nlftp/catalog.json
#     -> https://stac.yuiseki.net/mlit-nlftp/catalog.json
#
# so the next catalog is a sibling directory rather than another hostname.
# That also keeps the name one level deep, which is all Cloudflare's Universal
# SSL covers.
#
# Port 80 with a server_name, matching the z.yuiseki.net block already in
# sites-available/default: the tunnel hands nginx the Host header and nginx
# dispatches on it, so a new catalog host needs no new port.
#
#   sudo cp deploy/stac.yuiseki.net.conf /etc/nginx/sites-available/stac.yuiseki.net
#   sudo ln -s ../sites-available/stac.yuiseki.net /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;

    server_name stac.yuiseki.net;

    root /data/www/html/stac;

    charset utf-8;
    charset_types application/json application/geo+json text/markdown text/plain;

    types {
        application/json            json;
        application/geo+json        geojson;
        text/markdown               md;
        application/vnd.apache.parquet parquet;
    }
    default_type application/octet-stream;

    # A STAC client on another origin (STAC Browser, a notebook, a viewer)
    # cannot read a single file without these.
    add_header Access-Control-Allow-Origin  "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Range, If-None-Match, If-Modified-Since" always;
    add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges, ETag" always;

    location / {
        if ($request_method = OPTIONS) {
            return 204;
        }
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        try_files $uri $uri/ =404;
    }

    # The catalog is rebuilt rather than edited, so a reader should revalidate
    # instead of holding a collection for a week.
    location ~* \.(json|geojson)$ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Expose-Headers "Content-Length, ETag" always;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
    }

    access_log /var/log/nginx/stac.access.log;
    error_log  /var/log/nginx/stac.error.log;
}
